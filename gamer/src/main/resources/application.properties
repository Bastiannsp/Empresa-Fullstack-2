spring.application.name=gamer-api

# Configuración de la conexión con Oracle Autonomous Database
# El TNS_ADMIN dependerá de dónde coloques la wallet en el entorno de despliegue
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuración de JPA
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración para Swagger
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Configuración JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# CORS Configuration - comma-separated list of allowed origins or * for all
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
